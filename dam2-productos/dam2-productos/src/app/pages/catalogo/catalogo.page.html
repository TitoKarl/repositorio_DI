
<ion-header>
  <ion-toolbar color="tertiary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio"></ion-back-button>
    </ion-buttons>
    <ion-title>Catálogo DummyJSON</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
<!--  @if (loading) {-->
<!--    <div style="text-align: center; padding: 1rem;">-->
<!--      <ion-spinner name="crescent"></ion-spinner>-->
<!--      <p>Conectando con DummyJSON API...</p>-->
<!--    </div>-->
<!--  }-->

  @if (error) {
    <ion-card color="danger">
      <ion-card-header>
        <ion-card-title>Fallo de Red</ion-card-title>
      </ion-card-header>
      <ion-card-content>{{ error }}</ion-card-content>
    </ion-card>
  }

  @if (!loading && !error) {
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem;">
      @for (product of products; track product.id) {
        <ion-card>
          <img
            [src]="product.thumbnail"
            [alt]="product.title"
            style="height: 180px; object-fit: contain; width: 100%; padding: 10px;"
          />
          <ion-card-header>
            <ion-card-title style="font-size: 1.1rem;">
              {{ product.title }}
            </ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <p style="font-weight: bold; font-size: 1.2rem; color: var(--ion-color-primary);">
              {{ product.price | currency:'EUR' }}
            </p>
            <p>⭐ {{ product.rating }}</p>
            <p>📦 Stock: {{ product.stock }}</p>
            <p>🏷️ {{ product.category }}</p>
          </ion-card-content>
        </ion-card>
      }
    </div>
  }
</ion-content>
